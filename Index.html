<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <style>
    :root { --tkd-blue: #0d6efd; --tkd-red: #dc3545; --tkd-green: #198754; }
    body { background-color: #f8f9fa; padding-bottom: 110px; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; overscroll-behavior-y: contain; }
    .view-container { max-width: 500px; margin: 15px auto; padding: 15px; display: none; opacity: 0; transform: translateY(10px); transition: all 0.3s ease-out; }
    .active-view { display: block; opacity: 1; transform: translateY(0); }
    .quiz-card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 8px 30px rgba(0,0,0,0.05); border: none; min-height: 400px; }
    
    /* Trumps Specific */
    .trump-card { border: 2px solid #eee; border-radius: 12px; padding: 10px; background: white; cursor: pointer; transition: 0.2s; }
    .trump-card img { width: 100%; height: 80px; object-fit: cover; border-radius: 8px; margin-bottom: 5px; }
    .trump-stat { display: flex; justify-content: space-between; font-size: 0.75rem; border-bottom: 1px solid #f0f0f0; padding: 4px 0; }
    .trump-stat:hover { background: #e7f1ff; border-radius: 4px; }

    /* Footer & Nav */
    .footer-container { position: fixed; bottom: 0; left: 0; right: 0; z-index: 1000; background: white; border-top: 1px solid #eee; }
    .bottom-nav { height: 85px; display: flex; align-items: center; justify-content: space-around; padding-bottom: 10px; }
    .nav-item { flex: 1; border: none; background: none; color: #aaa; font-size: 0.8rem; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .nav-item.active { color: var(--tkd-blue); font-weight: bold; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<!-- Loading & Modals ... (Keep existing from your baseline) -->

<div id="view-game-center" class="view-container">
    <div class="quiz-card text-center">
        <h4 class="fw-bold mb-4">Game Center</h4>
        <div class="row g-3">
            <div class="col-6"><div class="game-card p-3 border rounded-3" onclick="startApp('game_match')"><i class="bi bi-grid-3x3-gap fs-2"></i><br>Match</div></div>
            <div class="col-6"><div class="game-card p-3 border rounded-3" onclick="startApp('game_swipe')"><i class="bi bi-check-circle fs-2"></i><br>Swipe</div></div>
            <div class="col-12"><button class="btn btn-info text-white w-100 p-3" onclick="startApp('game_trumps')"><i class="bi bi-trophy me-2"></i>Tul Trumps</button></div>
        </div>
        <button class="btn btn-light w-100 mt-4 rounded-pill" onclick="switchView('modes')">Back Home</button>
    </div>
</div>

<div id="view-trumps" class="view-container">
  <div class="quiz-card">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="fw-bold m-0">Tul Trumps</h5>
      <span class="badge bg-dark" id="trump-score"></span>
    </div>
    <div id="trump-battleground" class="text-center py-3 border rounded-4 bg-light mb-3 hidden"></div>
    <div id="trump-cards-container" class="row g-2"></div>
  </div>
</div>

<!-- Navbar ... (Keep existing) -->

<script>
  let playerHand = [], cpuHand = [], quizData = [], activeUser = "";

  function startApp(mode) {
    if (mode === 'game_trumps') {
      toggleLoad(true);
      google.script.run.withSuccessHandler(res => {
        toggleLoad(false);
        if(res.success) {
          playerHand = res.playerHand; cpuHand = res.cpuHand;
          renderTrumpCards(); switchView('trumps');
        } else alert(res.message);
      }).getTulTrumpsData(activeUser);
      return; // Exit here to prevent quiz logic from running
    }
    
    // Original Quiz/Game Logic for Match/Swipe/Test/Practice
    toggleLoad(true);
    // ... rest of startApp
  }

  function renderTrumpCards() {
    const container = document.getElementById('trump-cards-container');
    document.getElementById('trump-score').innerText = `CPU: ${cpuHand.length} | YOU: ${playerHand.length}`;
    container.innerHTML = '';
    playerHand.forEach((card, idx) => {
      container.innerHTML += `
        <div class="col-6">
          <div class="trump-card shadow-sm">
            <img src="${card.img}">
            <div class="fw-bold small mb-1">${card.name}</div>
            <div class="trump-stat" onclick="playTrump(${idx}, 'movements')"><span>Moves</span> <b>${card.movements}</b></div>
            <div class="trump-stat" onclick="playTrump(${idx}, 'stances')"><span>Stances</span> <b>${card.stances}</b></div>
            <div class="trump-stat" onclick="playTrump(${idx}, 'difficulty')"><span>Diff</span> <b>${card.difficulty}</b></div>
          </div>
        </div>`;
    });
  }

  function playTrump(pIdx, stat) {
    const pCard = playerHand[pIdx];
    const cIdx = Math.floor(Math.random() * cpuHand.length);
    const cCard = cpuHand[cIdx];
    const bg = document.getElementById('trump-battleground');
    bg.classList.remove('hidden');
    bg.innerHTML = `<div class="small text-muted mb-2">BATTLE: ${stat.toUpperCase()}</div>
                    <div class="d-flex justify-content-around">
                      <div><b>${pCard.name}</b><br>${pCard[stat]}</div>
                      <div class="text-danger fw-bold">VS</div>
                      <div><b>${cCard.name}</b><br>${cCard[stat]}</div>
                    </div>`;

    setTimeout(() => {
      if (pCard[stat] >= cCard[stat]) {
        playerHand.push(cpuHand.splice(cIdx, 1)[0]);
        bg.innerHTML = `<h5 class="text-success fw-bold">WINNER!</h5>`;
      } else {
        cpuHand.push(playerHand.splice(pIdx, 1)[0]);
        bg.innerHTML = `<h5 class="text-danger fw-bold">CPU WINS</h5>`;
      }
      setTimeout(() => {
        bg.classList.add('hidden');
        if (!playerHand.length || !cpuHand.length) {
          alert(playerHand.length ? "Champion!" : "Game Over!");
          switchView('modes');
        } else { renderTrumpCards(); }
      }, 1200);
    }, 1000);
  }
</script>
</body>
</html>
