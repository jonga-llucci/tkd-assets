<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <style>
    :root { --tkd-blue: #0d6efd; --tkd-red: #dc3545; }
    body { background-color: #f8f9fa; padding-bottom: 110px; font-family: 'Segoe UI', sans-serif; }
    .view-container { max-width: 500px; margin: 15px auto; padding: 15px; display: none; opacity: 0; transition: all 0.3s; }
    .active-view { display: block; opacity: 1; }
    .quiz-card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 8px 30px rgba(0,0,0,0.05); border: none; }
    
    /* Image Placeholder & Skeleton */
    .img-placeholder {
      position: relative; background: #eee; border-radius: 12px; overflow: hidden; min-height: 180px;
    }
    .img-placeholder::after {
      content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(90deg, #eee 25%, #f5f5f5 50%, #eee 75%);
      background-size: 200% 100%; animation: shimmer 1.5s infinite;
    }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .img-placeholder img { opacity: 0; transition: opacity 0.4s; width: 100%; }
    .img-placeholder img.loaded { opacity: 1; }
    .img-placeholder.done::after { display: none; }

    .game-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .game-card { background: #f8f9fa; border: 2px solid #eee; border-radius: 15px; padding: 20px; text-align: center; cursor: pointer; }
    .hidden { display: none !important; }
    
    .footer-container { position: fixed; bottom: 0; left: 0; right: 0; z-index: 1000; background: white; border-top: 1px solid #eee; }
    .bottom-nav { height: 85px; display: flex; align-items: center; justify-content: space-around; }
    .nav-item { border: none; background: none; color: #aaa; display: flex; flex-direction: column; align-items: center; font-size: 0.8rem; }
    .nav-item.active { color: var(--tkd-blue); font-weight: bold; }
  </style>
</head>
<body>

<div id="loading-overlay" class="hidden">
    <div class="spinner-border text-primary"></div>
</div>

<!-- Modal for Home Confirmation[cite: 1] -->
<div class="modal fade" id="confirmModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered mx-auto" style="max-width: 350px;">
    <div class="modal-content p-4 rounded-4 text-center">
        <h5 class="fw-bold">End Session?</h5>
        <p class="small text-muted">Get your grade for the questions answered so far?[cite: 1]</p>
        <div class="d-flex gap-2">
          <button class="btn btn-light w-50" data-bs-dismiss="modal">Stay</button>
          <button class="btn btn-primary w-50" onclick="confirmEndSession()">Confirm</button>
        </div>
    </div>
  </div>
</div>

<!-- Login View -->
<div id="view-login" class="view-container active-view">
  <div class="quiz-card text-center">
    <h2 class="fw-bold mb-4">TKD Academy</h2>
    <input type="text" id="user-input" class="form-control mb-3" placeholder="Username">
    <input type="password" id="pass-input" class="form-control mb-3" placeholder="Password">
    <button class="btn btn-primary w-100" onclick="handleLogin()">Login</button>
  </div>
</div>

<!-- Main Menu -->
<div id="view-modes" class="view-container">
  <div class="quiz-card">
    <h3>Hi, <span id="user-welcome"></span></h3>
    <button class="btn btn-warning w-100 mb-3" onclick="switchView('game-center')">Game Center</button>
    <button class="btn btn-primary w-100 mb-3" onclick="startApp('practice')">Daily Practice</button>
    <button class="btn btn-outline-danger w-100" onclick="startApp('test')">Mock Grading</button>
  </div>
</div>

<!-- Game Center -->
<div id="view-game-center" class="view-container">
    <div class="quiz-card text-center">
        <h4 class="fw-bold mb-4">Game Center</h4>
        <div class="game-grid">
            <div class="game-card" onclick="startApp('game_match')"><i class="bi bi-grid-3x3-gap"></i><strong>Match Pairs</strong></div>
            <div class="game-card" onclick="startApp('game_swipe')"><i class="bi bi-check-circle"></i><strong>True or False</strong></div>
            <div class="game-card" onclick="startApp('game_trumps')"><i class="bi bi-trophy"></i><strong>Tul Trumps</strong></div>
        </div>
    </div>
</div>

<!-- Tul Trumps Game View -->

  <div class="quiz-card">
    <?!= include('TulUI'); ?>
  </div>
</div>

<!-- Standard Quiz/Game View -->
<div id="view-quiz" class="view-container">
  <div class="progress-wrapper"><div id="progress-bar"></div></div>
  <div id="quiz-content"></div>
</div>

<div id="view-results" class="view-container">...</div> <!-- Results UI -->

<div class="footer-container hidden" id="navbar">
  <nav class="bottom-nav">
    <button class="nav-item active" onclick="switchView('modes')"><i class="bi bi-house-door"></i>Home</button>
    <button class="nav-item" onclick="switchView('account')"><i class="bi bi-person"></i>Account</button>
  </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  let quizData = [], currentIndex = 0, score = 0, activeUser = "", isQuizActive = false;

  function imgLoaded(img) {
    img.classList.add('loaded');
    img.parentElement.classList.add('done');
  }

  function handleLogin() {
    // ... Existing Login Logic ...
  }

  /**
   * START APP: Now surgically fetches only what is needed[cite: 1].
   */
  function startApp(mode) {
    isQuizActive = true;
    document.getElementById('loading-overlay').classList.remove('hidden');
    
    let serverCall;
    if (mode === 'game_match') serverCall = google.script.run.withSuccessHandler(setupMatch).getMatchingData(activeUser);
    else if (mode === 'game_swipe') serverCall = google.script.run.withSuccessHandler(setupSwipe).getTFData(activeUser);
    else if (mode === 'game_trumps') serverCall = google.script.run.withSuccessHandler(initTrumps).getTulTrumpsData(activeUser);
    else serverCall = google.script.run.withSuccessHandler(setupQuiz).getQuizData(activeUser, mode);
  }

  function switchView(id) {
    // Logic: If user hits Home during a session, show grade[cite: 1]
    if (isQuizActive && id === 'modes') {
      const m = new bootstrap.Modal(document.getElementById('confirmModal'));
      m.show();
      return;
    }
    // ... Standard switchView logic ...
  }

  function confirmEndSession() {
    const m = bootstrap.Modal.getInstance(document.getElementById('confirmModal'));
    if(m) m.hide();
    endQuiz(); // Triggers results based on answered questions[cite: 1]
  }

  function endQuiz() {
    isQuizActive = false;
    // Calculate score for answered vs total and show view-results[cite: 1]
    switchView('results');
  }
</script>
</body>
</html>
