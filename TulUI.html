<style>
  /* Keep all your .trump-card and .stat-row styles here */
  .game-container-inner { padding: 10px; }
</style>

<div class="game-container-inner">
  <div class="d-flex justify-content-between mb-2">
    <span>Your Cards: <span id="p-count" class="text-primary">0</span></span>
    <span>CPU Cards: <span id="c-count" class="text-danger">0</span></span>
  </div>
  
  <div id="active-card" class="trump-card">
    <img id="tul-img" class="tul-img" src="">
    <h2 id="tul-name" class="fw-bold mb-1">---</h2>
    <div id="tul-ready" class="badge bg-primary mb-3">Ready: ---</div>
    
    <div class="stat-list">
      <div class="stat-row" onclick="playTurn('movements')">
        <span><i class="bi bi-activity me-2"></i> Movements</span>
        <strong id="val-move">0</strong>
      </div>
      <div class="stat-row" onclick="playTurn('stances')">
        <span><i class="bi bi-person-walking me-2"></i> Stances</span>
        <strong id="val-stances">0</strong>
      </div>
      <div class="stat-row" onclick="playTurn('difficulty')">
        <span><i class="bi bi-star-fill me-2"></i> Difficulty</span>
        <strong id="val-diff">0</strong>
      </div>
    </div>
    
    <p class="meaning-text" id="tul-meaning"></p>
  </div>

  <div id="status" class="status-msg"></div>

  <div id="result-overlay" class="result-overlay hidden">
    <div id="result-box" class="result-box">
        <h2 id="result-text">WIN!</h2>
        <p id="result-details"></p>
    </div>
  </div>
</div>

<script>
  // Replace window.onload with a direct call
  (function initTrumps() {
    const user = activeUser || "Guest"; // Directly uses activeUser from Index.html
    google.script.run.withSuccessHandler(data => {
      if(data.error) { 
        document.getElementById('status').innerText = data.error; 
        return; 
      }
      playerHand = data.playerHand;
      cpuHand = data.cpuHand;
      updateUI();
    }).getTulTrumpsData(user);
  })();

  let playerHand = [], cpuHand = [];
  let isProcessing = false;

  window.onload = () => {
    let user = "Guest";
    try {
        user = window.parent.activeUser || "Guest";
    } catch(e) {
        console.log("Running in isolated mode");
    }

    google.script.run.withSuccessHandler(data => {
      if(data.error) { 
        document.getElementById('status').innerHTML = `<span class="text-warning text-center">${data.error}</span>`; 
        return; 
      }
      playerHand = data.playerHand;
      cpuHand = data.cpuHand;
      updateUI();
    }).getTulTrumpsData(user);
  };

  function updateUI() {
    if (playerHand.length === 0) { showEnd("CPU WINS! Try again?"); return; }
    if (cpuHand.length === 0) { showEnd("YOU ARE THE CHAMPION!"); return; }

    const cur = playerHand[0];
    document.getElementById('tul-name').innerText = cur.name;
    document.getElementById('tul-img').src = cur.img;
    document.getElementById('tul-ready').innerText = "Ready: " + cur.readyStance;
    document.getElementById('val-move').innerText = cur.movements;
    document.getElementById('val-stances').innerText = cur.stances;
    document.getElementById('val-diff').innerText = cur.difficulty;
    document.getElementById('tul-meaning').innerText = cur.meaning;
    
    document.getElementById('p-count').innerText = playerHand.length;
    document.getElementById('c-count').innerText = cpuHand.length;
    isProcessing = false;
  }

  function playTurn(stat) {
    if (isProcessing) return;
    isProcessing = true;

    const pCard = playerHand.shift();
    const cCard = cpuHand.shift();
    
    const overlay = document.getElementById('result-overlay');
    const resText = document.getElementById('result-text');
    const resDetails = document.getElementById('result-details');

    // Make the stat name look nice (e.g., "movements" -> "Movements")
    const statLabel = stat.charAt(0).toUpperCase() + stat.slice(1);

    overlay.classList.remove('hidden');
    setTimeout(() => overlay.classList.add('show'), 10);

    if (pCard[stat] > cCard[stat]) {
      resText.innerText = "ROUND WIN!";
      resText.className = "fw-bold text-win";
      // Logic: Explain WHY you won
      resDetails.innerHTML = `<strong>${pCard.name}</strong> beat <strong>${cCard.name}</strong> because it has <strong>${pCard[stat]}</strong> ${stat}, while ${cCard.name} only has ${cCard[stat]}.`;
      playerHand.push(pCard, cCard);
    } 
    else if (pCard[stat] < cCard[stat]) {
      resText.innerText = "ROUND LOSS";
      resText.className = "fw-bold text-loss";
      // Logic: Explain WHY you lost
      resDetails.innerHTML = `<strong>${cCard.name}</strong> beat <strong>${pCard.name}</strong> because it has <strong>${cCard[stat]}</strong> ${stat}, but ${pCard.name} only has ${pCard[stat]}.`;
      cpuHand.push(cCard, pCard);
    } 
    else {
      resText.innerText = "DRAW";
      resText.className = "fw-bold text-draw";
      resDetails.innerHTML = `Both <strong>${pCard.name}</strong> and <strong>${cCard.name}</strong> have <strong>${pCard[stat]}</strong> ${stat}. <br><small>Cards returned to the bottom of the deck.</small>`;
      playerHand.push(pCard); cpuHand.push(cCard);
    }

    // Auto-close the result box after 3 seconds (slightly longer to allow for reading)
    setTimeout(() => {
      overlay.classList.remove('show');
      setTimeout(() => {
        overlay.classList.add('hidden');
        updateUI();
      }, 300);
    }, 3500);
  }

  function showEnd(txt) {
  // If the user wins, trigger the main app's confetti
  if (txt.includes("CHAMPION")) {
    // We try to find the confetti function in the parent window
    if (window.parent && typeof window.parent.triggerConfetti === 'function') {
        window.parent.triggerConfetti();
    } else {
        // This helps for debugging if it still won't fire
        console.log("Found parent but couldn't find triggerConfetti function.");
    }
  }

  document.querySelector('.game-container').innerHTML = `
    <div class="text-center mt-5">
      <h2 class="fw-bold">${txt}</h2>
      <button class="btn btn-primary mt-4 px-5" onclick="location.reload()">Play Again</button>
    </div>`;
  }
</script>
