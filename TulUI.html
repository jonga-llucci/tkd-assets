<style>
  /* Core Card Styling */
  .trump-card { 
    background: white; 
    border-radius: 15px; 
    padding: 20px; 
    box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
    text-align: center;
    margin-top: 10px;
  }

  /* Fixed List Item Buttons */
  .list-group-item {
    cursor: pointer !important;
    transition: all 0.2s ease !important;
    user-select: none !important;
    position: relative;
    z-index: 10;
    background-color: #ffffff !important;
  }

  /* Hover State - This MUST work now */
  .list-group-item:hover {
    background-color: #f0f7ff !important; /* Light blue tint */
    color: #0d6efd !important;
  }

  /* Pressed State */
  .list-group-item:active {
    background-color: #e9ecef !important;
    transform: scale(0.98);
  }

  /* Removes the sticky "shaded" look after clicking */
.list-group-item-action:focus {
    background-color: #fff !important; /* Reset to white */
    color: inherit !important;
    box-shadow: none !important;
    outline: none !important;
}

/* Keeps the hover effect working normally */
.list-group-item-action:hover {
    background-color: #f8f9fa !important;
    color: #0d6efd !important;
}

  .tul-img { 
    width: 100%; 
    max-height: 180px; 
    object-fit: contain; 
    border-radius: 10px; 
    margin-bottom: 15px; 
    background: #f8f9fa;
  }

  .meaning-text { font-size: 0.85rem; color: #666; font-style: italic; margin-top: 15px; }
  
  /* Overlay Styling */
  .result-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.8); display: flex; align-items: center;
    justify-content: center; z-index: 2000; opacity: 0; visibility: hidden;
    transition: all 0.3s ease;
  }
  .result-overlay.show { opacity: 1; visibility: visible; }
  .result-box { background: white; padding: 30px; border-radius: 20px; text-align: center; max-width: 80%; }
  .text-win { color: #198754; }
  .text-loss { color: #dc3545; }
  .text-draw { color: #6c757d; }
  .hidden { display: none !important; }
</style>

<div class="game-container-inner">
  <div class="d-flex justify-content-between mb-2 fw-bold">
    <span>Your Cards: <span id="player-card-count" class="text-primary">0</span></span>
    <span>CPU Cards: <span id="cpu-card-count" class="text-danger">0</span></span>
  </div>
  
  <div id="active-card" class="trump-card">
    <img id="tul-img" class="tul-img" src="https://via.placeholder.com/150?text=Loading...">
    <h2 id="tul-name" class="fw-bold mb-1">---</h2>
    <div id="tul-card-ready" class="badge bg-primary mb-3">Ready: ---</div>
    
    <div class="stat-list">
      <div class="stat-row" onclick="playTurn('movements')">
        <span><i class="bi bi-activity me-2"></i> Movements</span>
        <strong id="val-movements">0</strong>
      </div>
      <div class="stat-row" onclick="playTurn('stances')">
        <span><i class="bi bi-person-walking me-2"></i> Stances</span>
        <strong id="val-stances">0</strong>
      </div>
      <div class="stat-row" onclick="playTurn('difficulty')">
        <span><i class="bi bi-star-fill me-2"></i> Difficulty</span>
        <strong id="val-difficulty">0</strong>
      </div>
    </div>
    
    <p class="meaning-text" id="tul-card-meaning"></p>
  </div>

  <div id="status" class="mt-3 text-center"></div>


<script>
  let playerHand = [], cpuHand = [];
  let isProcessing = false;
  let roundTimeout = null;

  // Wait for the DOM and GAS environment to be ready
  function startSequence() {
    console.log("TulUI Loaded. Waiting 500ms to fetch data...");
    setTimeout(initTrumps, 500); 
  }

  function initTrumps() {
    const user = (window.parent && window.parent.activeUser) || window.activeUser || "Guest";
    
    // Visual cue that loading is happening
    document.getElementById('status').innerHTML = '<span class="badge bg-info">Loading Deck...</span>';

    google.script.run
      .withSuccessHandler(data => {
        console.log("Data received from server:", data);
        document.getElementById('status').innerHTML = ""; // Clear loading
        
        if(!data || data.error) { 
          document.getElementById('status').innerHTML = `<div class="alert alert-warning small">${data ? data.error : 'No data returned'}</div>`;
          return; 
        }
        
        playerHand = data.playerHand;
        cpuHand = data.cpuHand;
        updateUI();
      })
      .withFailureHandler(err => {
        console.error("GAS Server Error:", err);
        document.getElementById('status').innerHTML = `<div class="alert alert-danger small">Connection Error: ${err.message}</div>`;
      })
      .getTulTrumpsData(user);
  }

  function updateUI() {
    if (!playerHand || playerHand.length === 0) {
      document.getElementById('active-card').innerHTML = `<div class="p-4"><h5>Deck is empty</h5><p class="small">Check Tuls sheet filter logic.</p></div>`;
      return;
    }

    const cur = playerHand[0];
    document.getElementById('tul-name').innerText = cur.name;
    document.getElementById('tul-img').src = cur.img || "https://via.placeholder.com/150?text=No+Image";
    document.getElementById('tul-card-ready').innerText = "Ready: " + (cur.readyStance || "---");
    document.getElementById('val-movements').innerText = cur.movements || 0;
    document.getElementById('val-stances').innerText = cur.stances || 0;
    document.getElementById('val-difficulty').innerText = cur.difficulty || 0;
    document.getElementById('tul-meaning').innerText = cur.meaning || "";
    
    document.getElementById('player-card-count').innerText = playerHand.length;
    document.getElementById('cpu-card-count').innerText = cpuHand.length;
    isProcessing = false;
  }

  // Trigger the sequence
  startSequence();


  function playTurn(stat) {
    if (isProcessing || playerHand.length === 0 || cpuHand.length === 0) return;
    isProcessing = true;

    const pCard = playerHand[0];
    const cCard = cpuHand[0];
    const pVal = parseInt(pCard[stat]) || 0;
    const cVal = parseInt(cCard[stat]) || 0;

    const overlay = document.getElementById('result-overlay');
    const resText = document.getElementById('result-text');
    const resDetails = document.getElementById('result-details');

    let statusText = "";
    let textColorClass = "";
    let resultMessage = "";

    if (pVal > cVal) {
        statusText = "ROUND WON!";
        textColorClass = "text-success";
        resultMessage = `Your <strong>${pCard.name}</strong> (${pVal}) beat <strong>${cCard.name}</strong> (${cVal}).`;
        playerHand.push(playerHand.shift(), cpuHand.shift());
    } else if (cVal > pVal) {
        statusText = "ROUND LOST";
        textColorClass = "text-danger";
        resultMessage = `CPU's <strong>${cCard.name}</strong> (${cVal}) beat <strong>${pCard.name}</strong> (${pVal}).`;
        cpuHand.push(cpuHand.shift(), playerHand.shift());
    } else {
        statusText = "DRAW";
        textColorClass = "text-warning";
        resultMessage = `Both cards have <strong>${pVal}</strong>.`;
        playerHand.push(playerHand.shift());
        cpuHand.push(cpuHand.shift());
    }

    resText.innerText = statusText;
    resText.className = `display-6 fw-bold ${textColorClass}`;
    resDetails.innerHTML = `
        <p class="mb-4">${resultMessage}</p>
        <div class="d-grid">
            <button id="next-round-btn" class="btn btn-primary btn-lg rounded-pill py-3" onclick="manualNextRound()">
                Next Round (3s)
            </button>
        </div>
    `;

    overlay.classList.remove('hidden');
    
    let count = 3;
    if (roundTimeout) clearInterval(roundTimeout);
    roundTimeout = setInterval(() => {
        count--;
        const btn = document.getElementById('next-round-btn');
        if (btn) btn.innerText = `Next Round (${count}s)`;
        if (count <= 0) manualNextRound();
    }, 1000);
}

function manualNextRound() {
    clearInterval(roundTimeout);
    const overlay = document.getElementById('result-overlay');
    
    if (playerHand.length === 0 || cpuHand.length === 0) {
        overlay.classList.add('hidden');
        checkGameOver();
        return;
    }

    // Safety: Ensure UI updates and lock is released
    overlay.classList.add('hidden');
    isProcessing = false;
    updateGameUI();
}

function checkGameOver() {
    if (playerHand.length === 0 || cpuHand.length === 0) {
        const resText = document.getElementById('result-text');
        const resDetails = document.getElementById('result-details');
        const overlay = document.getElementById('result-overlay');
        const isWin = cpuHand.length === 0;

        resText.innerText = isWin ? "CHAMPION!" : "GAME OVER";
        resText.className = isWin ? "text-success display-4 fw-bold" : "text-danger display-4 fw-bold";
        resDetails.innerHTML = `
          <p class="lead">${isWin ? 'You captured all the cards!' : 'The CPU won this time.'}</p>
          <div class="d-grid gap-2 mt-4">
              <button class="btn btn-primary btn-lg rounded-pill" onclick="restartGame()">Play Again</button>
              <button class="btn btn-outline-secondary rounded-pill" onclick="goHome()">Home</button>
          </div>`;
        overlay.classList.remove('hidden');
        return true;
    }
    return false;
}

  function showEnd(txt) {
    if (txt.includes("CHAMPION") && typeof triggerConfetti === 'function') {
        triggerConfetti();
    }
    document.getElementById('active-card').innerHTML = `
      <div class="text-center py-5">
        <h2 class="fw-bold">${txt}</h2>
        <button class="btn btn-primary mt-4 px-5 rounded-pill" onclick="switchView('modes')">Finish</button>
      </div>`;
  }
</script>
