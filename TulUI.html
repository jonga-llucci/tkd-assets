<!DOCTYPE html>
<html>
<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <style>
    /* FIX: Changed background to Light Grey so text is readable */
    body { background: #f8f9fa; color: #333; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }
    
    /* Ensure the container takes up full height and allows vertical scrolling if needed */
    .game-container { max-width: 450px; margin: auto; padding: 20px; min-height: 100vh; display: flex; flex-direction: column; }
    
    .trump-card { 
      background: white; color: #222; border-radius: 20px; padding: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1); position: relative;
      flex-grow: 1; /* Allows the card to take up remaining vertical space */
    }
    .tul-img { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; margin-bottom: 15px; background: #eee; }
    
    .stat-row { 
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 15px; margin: 8px 0; background: white;
      border: 2px solid #f0f0f0; border-radius: 12px; cursor: pointer; transition: 0.2s;
    }
    .stat-row:hover { border-color: #0d6efd; background: #e7f1ff; transform: scale(1.02); }
    .stat-row strong { font-size: 1.2rem; color: #0d6efd; }

    /* FIX: Removed fixed height and line-clamping so full meaning is displayed */
    .meaning-text { font-size: 0.85rem; color: #666; line-height: 1.4; margin-top: 15px; }
    
    .status-msg { min-height: 60px; display: flex; align-items: center; justify-content: center; font-weight: bold; margin-top: 15px; }
    .header-count { small text-uppercase fw-bold text-muted; padding: 0 10px; margin-bottom: 15px; }

    .result-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.6); display: flex; align-items: center;
    justify-content: center; z-index: 1000; transition: 0.3s;
    }
    .result-box {
        background: white; padding: 30px; border-radius: 20px;
        text-align: center; transform: scale(0.8); transition: 0.3s;
        width: 80%; max-width: 300px;
    }
    .result-overlay.show .result-box { transform: scale(1); }
    .hidden { display: none !important; }

    /* Colors for the result text */
    .text-win { color: #198754; }
    .text-loss { color: #dc3545; }
    .text-draw { color: #ffc107; }
  </style>
</head>
<body>

<div class="container-fluid p-3 text-center">
  <div class="d-flex justify-content-around mb-3">
    <div class="small fw-bold">Your Deck: <span id="p-count" class="text-primary">0</span></div>
    <div class="small fw-bold">CPU Deck: <span id="c-count" class="text-danger">0</span></div>
  </div>

  <div id="player-card-container" class="mx-auto" style="max-width: 400px;">
    <!-- Loading State -->
    <div class="card shadow-sm border-0 rounded-4 p-5 text-center">
      <div class="spinner-border text-primary mx-auto mb-3" role="status"></div>
      <p class="text-muted">Mastering your deck...</p>
    </div>
  </div>

  <div id="game-feedback" class="mt-3" style="min-height: 40px;"></div>
</div>

<style>
  .trump-card { border: 2px solid #dee2e6; transition: all 0.3s ease; }
  .stat-row { 
    cursor: pointer; 
    transition: all 0.2s; 
    border: 1px solid #f0f0f0 !important;
    border-radius: 10px;
    margin-bottom: 8px;
    background: #fff;
  }
  .stat-row:hover { 
    background-color: #e7f1ff; 
    border-color: #0d6efd !important;
    transform: scale(1.02);
  }
  .interpretation-box {
    font-size: 0.85rem;
    line-height: 1.4;
    background: #f8f9fa;
    border-radius: 8px;
    max-height: 100px;
    overflow-y: auto;
  }
  .result-msg { font-weight: 800; font-size: 1.2rem; text-transform: uppercase; }
</style>

<script>
  let playerHand = [], cpuHand = [];
  let isProcessing = false;
  let gameUser = "";

  function initTulTrumps(username) {
    console.log("Initializing Game for:", username);
    gameUser = username;
    loadDeck();
  }

  function loadDeck() {
    google.script.run
      .withSuccessHandler(data => {
        if (data.error) {
          renderError(data.error);
          return;
        }
        if (!data || data.length < 2) {
          renderError("Insufficient cards in 'Tuls' sheet. Need at least 2.");
          return;
        }
        
        // Shuffle and Deal
        const shuffled = data.sort(() => Math.random() - 0.5);
        const mid = Math.ceil(shuffled.length / 2);
        playerHand = shuffled.slice(0, mid);
        cpuHand = shuffled.slice(mid);
        updateDisplay();
      })
      .withFailureHandler(err => {
        renderError("Connection Failed: " + err.message);
      })
      .getUserTulDeck(gameUser);
  }

  function renderError(msg) {
    document.getElementById('player-card-container').innerHTML = `
      <div class="alert alert-danger shadow-sm">
        <i class="bi bi-exclamation-triangle-fill"></i><br>
        <strong>Load Error</strong><br>${msg}
        <button class="btn btn-sm btn-outline-danger d-block mx-auto mt-3" onclick="loadDeck()">Retry Connection</button>
      </div>`;
  }

  function updateDisplay() {
    const card = playerHand[0];
    const container = document.getElementById('player-card-container');
    document.getElementById('p-count').innerText = playerHand.length;
    document.getElementById('c-count').innerText = cpuHand.length;

    if (!card) {
      checkGameOver();
      return;
    }

    container.innerHTML = `
      <div class="card shadow-lg border-0 rounded-4 p-3 trump-card">
        <div class="text-end mb-2">
          <span class="badge rounded-pill bg-dark">Ready: ${card.readyPost}</span>
        </div>
        
        <img src="${card.img || ''}" class="img-fluid rounded-3 mb-3" style="height: 160px; object-fit: cover;" onerror="this.src='https://placehold.co/400x200?text=No+Image'">
        
        <h3 class="fw-bold text-primary mb-1">${card.name}</h3>
        
        <div class="interpretation-box p-2 mb-3 text-muted border">
          <strong>Interpretation:</strong> ${card.interpretation || 'No data available.'}
        </div>

        <div class="stat-row d-flex justify-content-between align-items-center p-3 shadow-sm" onclick="playTurn('moveCount')">
          <span><i class="bi bi-hash me-2 text-primary"></i> Movements</span>
          <strong class="fs-5">${card.moveCount}</strong>
        </div>
        
        <div class="stat-row d-flex justify-content-between align-items-center p-3 shadow-sm" onclick="playTurn('stances')">
          <span><i class="bi bi-person-standing me-2 text-success"></i> Stances</span>
          <strong class="fs-5">${card.stances}</strong>
        </div>
        
        <div class="stat-row d-flex justify-content-between align-items-center p-3 shadow-sm" onclick="playTurn('difficulty')">
          <span><i class="bi bi-star-fill me-2 text-warning"></i> Difficulty</span>
          <strong class="fs-5">${card.difficulty}</strong>
        </div>
        
        <p class="text-center mt-2 small text-muted">Tap a stat to challenge the CPU</p>
      </div>
    `;
  }

  function playTurn(stat) {
    if (isProcessing || playerHand.length === 0 || cpuHand.length === 0) return;
    isProcessing = true;

    const pCard = playerHand[0];
    const cCard = cpuHand[0];
    const pVal = parseInt(pCard[stat]) || 0;
    const cVal = parseInt(cCard[stat]) || 0;

    const feedback = document.getElementById('game-feedback');
    
    if (pVal >= cVal) {
      feedback.innerHTML = `<div class="result-msg text-success animate__animated animate__tada">You Win! ${pVal} vs ${cVal}</div>`;
      playerHand.push(playerHand.shift(), cpuHand.shift());
    } else {
      feedback.innerHTML = `<div class="result-msg text-danger animate__animated animate__shakeX">CPU Wins! ${pVal} vs ${cVal}</div>`;
      cpuHand.push(cpuHand.shift(), playerHand.shift());
    }

    setTimeout(() => {
      feedback.innerHTML = '';
      isProcessing = false;
      updateDisplay();
      checkGameOver();
    }, 1800);
  }

  function checkGameOver() {
    if (playerHand.length === 0 || cpuHand.length === 0) {
      const win = playerHand.length > 0;
      alert(win ? "Congratulations! You won the entire deck!" : "CPU has defeated you this time.");
      if(typeof switchView === "function") switchView('modes');
    }
  }
</script>
</body>
</html>
