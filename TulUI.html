<!DOCTYPE html>
<html>
<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <style>
    /* FIX: Changed background to Light Grey so text is readable */
    body { background: #f8f9fa; color: #333; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }
    
    /* Ensure the container takes up full height and allows vertical scrolling if needed */
    .game-container { max-width: 450px; margin: auto; padding: 20px; min-height: 100vh; display: flex; flex-direction: column; }
    
    .trump-card { 
      background: white; color: #222; border-radius: 20px; padding: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1); position: relative;
      flex-grow: 1; /* Allows the card to take up remaining vertical space */
    }
    .tul-img { width: 100%; height: 200px; object-fit: cover; border-radius: 12px; margin-bottom: 15px; background: #eee; }
    
    .stat-row { 
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 15px; margin: 8px 0; background: white;
      border: 2px solid #f0f0f0; border-radius: 12px; cursor: pointer; transition: 0.2s;
    }
    .stat-row:hover { border-color: #0d6efd; background: #e7f1ff; transform: scale(1.02); }
    .stat-row strong { font-size: 1.2rem; color: #0d6efd; }

    /* FIX: Removed fixed height and line-clamping so full meaning is displayed */
    .meaning-text { font-size: 0.85rem; color: #666; line-height: 1.4; margin-top: 15px; }
    
    .status-msg { min-height: 60px; display: flex; align-items: center; justify-content: center; font-weight: bold; margin-top: 15px; }
    .header-count { small text-uppercase fw-bold text-muted; padding: 0 10px; margin-bottom: 15px; }
  </style>
</head>
<body>

<div class="game-container">
  <div class="d-flex justify-content-between header-count">
    <span>Your Cards: <span id="p-count" class="text-primary">0</span></span>
    <span>CPU Cards: <span id="c-count" class="text-danger">0</span></span>
  </div>

  <div id="active-card" class="trump-card">
    <img id="tul-img" class="tul-img" src="">
    <h2 id="tul-name" class="fw-bold mb-1">---</h2>
    <div id="tul-ready" class="badge bg-primary mb-3">Ready: ---</div>
    
    <div class="stat-list">
      <div class="stat-row" onclick="playTurn('movements')">
        <span><i class="bi bi-activity me-2"></i> Movements</span>
        <strong id="val-move">0</strong>
      </div>
      <div class="stat-row" onclick="playTurn('stances')">
        <span><i class="bi bi-person-walking me-2"></i> Stances</span>
        <strong id="val-stances">0</strong>
      </div>
      <div class="stat-row" onclick="playTurn('difficulty')">
        <span><i class="bi bi-star-fill me-2"></i> Difficulty</span>
        <strong id="val-diff">0</strong>
      </div>
    </div>
    
    <p class="meaning-text" id="tul-meaning"></p>
  </div>

  <div id="status" class="status-msg"></div>
</div>

<script>
  let playerHand = [], cpuHand = [];
  let isProcessing = false;

  window.onload = () => {
    let user = "Guest";
    try {
        user = window.parent.activeUser || "Guest";
    } catch(e) {
        console.log("Running in isolated mode");
    }

    google.script.run.withSuccessHandler(data => {
      if(data.error) { 
        document.getElementById('status').innerHTML = `<span class="text-warning text-center">${data.error}</span>`; 
        return; 
      }
      playerHand = data.playerHand;
      cpuHand = data.cpuHand;
      updateUI();
    }).getTulTrumpsData(user);
  };

  function updateUI() {
    if (playerHand.length === 0) { showEnd("CPU WINS! Try again?"); return; }
    if (cpuHand.length === 0) { showEnd("YOU ARE THE CHAMPION!"); return; }

    const cur = playerHand[0];
    document.getElementById('tul-name').innerText = cur.name;
    document.getElementById('tul-img').src = cur.img;
    document.getElementById('tul-ready').innerText = "Ready: " + cur.readyStance;
    document.getElementById('val-move').innerText = cur.movements;
    document.getElementById('val-stances').innerText = cur.stances;
    document.getElementById('val-diff').innerText = cur.difficulty;
    document.getElementById('tul-meaning').innerText = cur.meaning;
    
    document.getElementById('p-count').innerText = playerHand.length;
    document.getElementById('c-count').innerText = cpuHand.length;
    isProcessing = false;
  }

  function playTurn(stat) {
    if (isProcessing) return;
    isProcessing = true;

    const pCard = playerHand.shift();
    const cCard = cpuHand.shift();
    const status = document.getElementById('status');

    if (pCard[stat] > cCard[stat]) {
      status.innerHTML = `<span class="text-success text-center">WIN! ${pCard.name} (${pCard[stat]}) beats ${cCard.name} (${cCard[stat]})</span>`;
      playerHand.push(pCard, cCard);
    } else if (pCard[stat] < cCard[stat]) {
      status.innerHTML = `<span class="text-danger text-center">LOSS! ${cCard.name} (${cCard[stat]}) beats ${pCard.name} (${pCard[stat]})</span>`;
      cpuHand.push(cCard, pCard);
    } else {
      status.innerHTML = `<span class="text-warning text-center">DRAW! Card returned to bottom</span>`;
      playerHand.push(pCard); cpuHand.push(cCard);
    }

    setTimeout(() => {
      status.innerHTML = "";
      updateUI();
    }, 2500);
  }

  function showEnd(txt) {
    document.querySelector('.game-container').innerHTML = `
      <div class="text-center mt-5">
        <h2 class="fw-bold">${txt}</h2>
        <button class="btn btn-primary mt-4 px-5" onclick="location.reload()">Play Again</button>
      </div>`;
  }
</script>
</body>
</html>
