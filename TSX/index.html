<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0d6efd">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TKD Academy">
  <title>TKD Academy</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d6efd;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <button id="install-btn" style="
    display: none;
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9999;
    background: #0d6efd;
    color: white;
    border: none;
    border-radius: 24px;
    padding: 12px 28px;
    font-size: 1rem;
    font-weight: 700;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    cursor: pointer;
    white-space: nowrap;">
    ⬇ Add TKD Academy to Home Screen
  </button>

  <div id="ios-prompt" style="
    display: none;
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9999;
    background: white;
    border-radius: 16px;
    padding: 16px 20px;
    font-size: 0.85rem;
    text-align: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    width: 85%;
    max-width: 340px;">
    <div style="font-weight:700; margin-bottom:6px;">Install TKD Academy</div>
    <div style="color:#555;">
      Tap <strong>Share</strong>
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="#0d6efd" viewBox="0 0 16 16" style="vertical-align:middle;">
        <path d="M8 1.5a.5.5 0 0 1 .5.5v8.793l2.146-2.147a.5.5 0 0 1 .708.708l-3 3a.5.5 0 0 1-.708 0l-3-3a.5.5 0 0 1 .708-.708L7.5 10.793V2a.5.5 0 0 1 .5-.5z"/>
        <path d="M3 13.5a.5.5 0 0 1 .5-.5h9a.5.5 0 0 1 0 1h-9a.5.5 0 0 1-.5-.5z"/>
      </svg>
      then <strong>Add to Home Screen</strong>
    </div>
    <button onclick="document.getElementById('ios-prompt').style.display='none'; sessionStorage.setItem('iosPromptDismissed','1');" style="
      margin-top: 10px; border: none; background: none; color: #0d6efd; font-size: 0.8rem; cursor: pointer;">
      Dismiss
    </button>
  </div>

  <iframe
    src = "https://script.google.com/macros/s/AKfycbzezenrer7hJ48Bq2xWSb9TpC3oEkU2q3mcjMT6EWqC0iKGUaiRt1NK0QsGqj1GIwZiNA/exec"
    allow="fullscreen"
    loading="eager"
    id="appFrame">
  </iframe>

  <script>
      
    let deferredPrompt = null;

    function isIos() {
      return /iphone|ipad|ipod/i.test(navigator.userAgent);
    }

    function isInStandaloneMode() {
      return window.navigator.standalone === true;
    }

    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('install-btn').style.display = 'block';
    });

    document.getElementById('install-btn').addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      deferredPrompt = null;
      document.getElementById('install-btn').style.display = 'none';
    });

    window.addEventListener('appinstalled', () => {
      document.getElementById('install-btn').style.display = 'none';
      deferredPrompt = null;
    });

    if (isIos() && !isInStandaloneMode()) {
      if (!sessionStorage.getItem('iosPromptDismissed')) {
        document.getElementById('ios-prompt').style.display = 'block';
      }
    }

    if ('serviceWorker' in navigator) {
      // Register with an explicit scope for this folder
      navigator.serviceWorker.register('./sw.js', { scope: './' })
        .then(() => console.log('Scoped SW registered'))
        .catch(err => console.error('SW registration failed:', err));
    }
  </script>

</body>
</html>
